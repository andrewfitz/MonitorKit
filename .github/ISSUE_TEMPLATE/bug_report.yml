name: Bug report
description: Something in MonitorKit is wrong, crashes or performs worse than documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please don't report security vulnerabilities here; see [SECURITY.md](https://github.com/andrewfitz/MonitorKit/blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you saw and what you expected instead. For a picture or scope problem, a screenshot or a short capture helps a lot.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest code or steps that show the problem. Include the settings (tools, LUT, output colour, scope) and the frame size.
      render: swift
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: MonitorKit version
      description: The release tag or commit.
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      multiple: true
      options:
        - MonitorKitCore
        - MonitorKit
        - MonitorKitScopes
        - MonitorKitAudio
        - MonitorKitUI
        - Not sure
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: macOS 26.6 (25G83), or iOS 26.5
    validations:
      required: true

  - type: input
    id: xcode
    attributes:
      label: Xcode version
      placeholder: Xcode 26.6 (17F113)
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: Device and GPU
      description: The Mac or iOS device model and its chip.
      placeholder: MacBook Pro, M4 Max (40-core GPU)
    validations:
      required: true

  - type: dropdown
    id: encode-path
    attributes:
      label: Encode path
      options:
        - Classic (MTLCommandBuffer)
        - Metal 4 (MTL4CommandBuffer)
        - Both
        - Not applicable (audio, settings, UI only)
    validations:
      required: true

  - type: input
    id: pixel-format
    attributes:
      label: Source pixel format
      description: The CoreVideo pixel format and the signal (range, matrix, transfer). Leave empty for audio-only issues.
      placeholder: "'v210', 10-bit video range, BT.709, S-Log3"

  - type: input
    id: output
    attributes:
      label: Output target
      description: The target pixel format and colour space, and whether EDR is on.
      placeholder: rgba16Float, extended linear Display P3, EDR on

  - type: textarea
    id: logs
    attributes:
      label: Logs and validation output
      description: Crash logs, console output, or the output of running with MTL_DEBUG_LAYER=1 MTL_SHADER_VALIDATION=1.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I reproduced this on the latest release or on main.
